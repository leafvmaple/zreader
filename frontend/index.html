<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Kept in step with APP_NAME in src/brand.ts. Static rather than set
         from JS so the tab is never briefly titled something else. -->
    <title>枫读</title>
    <!-- Resolve the shelf theme before first paint to avoid a flash: explicit
         localStorage choice wins, otherwise follow the OS preference. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('zreader.theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
