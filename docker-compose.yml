services:
  zreader:
    # Default: build locally from this checkout. The produced image is tagged
    # with the `image:` name below, so it stays consistent with the published
    # artifact. To consume the published image instead (no local toolchain),
    # comment out the `build:` block.
    build: .
    image: docker.io/leafvmaple/zreader:latest
    # For local builds set `pull_policy: never` to skip the registry pull.
    # On a NAS / remote host without this checkout, remove `build:` above
    # and let Docker pull `docker.io/leafvmaple/zreader:latest` instead.
    pull_policy: never
    container_name: zreader
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Optional: override the listen port (host-side mapping above must match).
      # ZREADER_PORT: "8080"
      # Multiple library roots are colon-separated, e.g. "/library:/library2".
      ZREADER_LIBRARY_PATH: "/library"
    volumes:
      # Persistent metadata: SQLite db + scan state.
      - ./data:/data
      # Your books. Point this at wherever your TXT files live.
      # Writable so the scanner can write the formatted cache under
      # ./books/<author>/<title>.txt — see AGENTS.md "Pipeline: scan →
      # format → parse". Source TXTs at the top level are never modified.
      # `:ro` would block both the cache and the legacy `.bak` migration,
      # so leave it writable in the common case.
      - ./books:/library
